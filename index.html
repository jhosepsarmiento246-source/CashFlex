<style>

function dayLabel(k){const t=new Date();if(k===dKey(t))return'Hoy';t.setDate(t.getDate()-1);if(k===dKey(t))return'Ayer';return parseD(k).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}

/* Inicio, bienvenida y menú lateral */
const rmv=()=>{};
function start(){let d=null;try{d=JSON.parse(ls.get('mc3_data'))}catch(e){}
  if(!d||!d.accounts){try{d=JSON.parse(ls.get('mc2_d_'+ls.get('mc2_ses')))}catch(e){d=null}}
  D=d&&d.accounts?d:dflt();migrate();
  V={view:'res',ty:'gasto',per:'mes',off:0,from:'',to:'',acc:'all',sort:'fecha'};
  $('#auth').hidden=true;$('#app').hidden=false;genRec();save();render()}
function welcome(){const a=$('#auth');a.hidden=false;$('#app').hidden=true;
  a.innerHTML=`<div class="logo">$</div><h1>Mis Cuentas</h1><p class="sub">Controla tus ingresos y gastos. Todo se guarda en tu teléfono y funciona sin internet.</p>
  <label>¿Cómo te llamas? (opcional)<input id="w-n" maxlength="30" autocomplete="given-name"></label>
  <button class="btn main" id="go">Continuar sin conexión</button><p class="note">No necesitas cuenta ni internet.</p>`;
  $('#go').onclick=()=>{const n=$('#w-n').value.trim();ls.set('mc3_ok','1');start();D.name=n;save();render()}}
function wipe(){if(confirm('¿Borrar todos los datos de este teléfono? No se puede deshacer.')){['mc3_data','mc3_ok','mc3_saved','mc2_ses'].forEach(k=>ls.del(k));D=null;location.reload()}}
const dr=$('#dr'),dp=$('#dp');
function menu(){const bal=D.accounts.reduce((s,a)=>s+abal(a),0),t0=+ls.get('mc3_saved')||0;

dr.addEventListener('click',e=>{const b=e.target.closest('[data-m2]');if(e.target===dr){dr.classList.remove('open');return}if(!b)return;const k=b.dataset.m2;dr.classList.remove('open');
  V.view=k;render();scrollTo(0,0)});
function exportCsv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Fecha','Hora','Tipo','Cuenta','Categoría','Nota','Monto'],...D.tx.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).map(t=>[t.ts.slice(0,10),t.ts.slice(11,16),t.type,(accOf(t.acc)||{}).name||'',catOf(t.cat).name,t.note||'',t.amt])];
  const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mis-cuentas.csv';a.click()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D){genRec();render()}});

/* Pagos habituales, recordatorios y gráficos */
const ICMAP={'Alimentación':'cart','Transporte':'bus','Hogar':'house','Servicios':'bulb','Salud':'heart','Ocio':'film','Compras':'bag','Salario':'briefcase','Ventas':'cash','Regalo':'gift'};
function migrate(){D.rm=D.rm||{};D.rec=D.rec||[];D.rem=D.rem||[];
  D.cats.forEach(c=>{if(!c.icon){c.icon=ICMAP[c.name]||'tag';delete c.emoji}});D.accounts.forEach(a=>{if(!a.icon){a.icon='wallet';delete a.emoji}})}
const addF=(k,f)=>{const d=parseD(k);if(f==='dia')d.setDate(d.getDate()+1);else if(f==='semana')d.setDate(d.getDate()+7);else if(f==='mes')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);return dKey(d)};
const FRQ={dia:'Cada día',semana:'Cada semana',mes:'Cada mes',anio:'Cada año'};
function genRec(){let n=0;const today=dKey(new Date());
  D.rec.forEach(r=>{let g=0;while(r.next<=today&&g++<400){const id='r'+r.id+r.next;
    if(!D.tx.some(x=>x.id===id)&&!(id in D.rm))D.tx.push({id,type:r.type,acc:r.acc,amt:r.amt,cat:r.cat,note:r.note,ts:r.next+'T09:00',u:Date.now()});
    r.next=addF(r.next,r.freq);r.u=Date.now();n++}});
  if(n)save();return n}
const dueRem=()=>D.rem.filter(r=>!r.done&&r.at<=nowLocal());
const banner=()=>dueRem().map(r=>`<div class="rmb">${ico('bell',20)}<b>${esc(r.title)}</b><button data-rd="${r.id}">Listo</button></div>`).join('');
function remDone(id){const r=D.rem.find(x=>x.id===id);if(!r)return;
  if(r.rep==='no')r.done=true;else{let g=0;while(r.at<=nowLocal()&&g++<400)r.at=addF(r.at.slice(0,10),r.rep)+r.at.slice(10)}
  r.u=Date.now();save();render()}
function vRec(){return`<h2 style="margin-top:16px">Pagos habituales</h2><p class="note" style="text-align:left">Se registran solos en la fecha indicada, también sin internet.</p>`
  +(D.rec.length?D.rec.map(r=>{const c=catOf(r.cat);return`<button class="tx" data-rc="${r.id}"><span class="ic" style="background:${c.color}33;color:${c.color}">${sym(c)}</span><span class="m"><b>${esc(r.note||c.name)}</b><span>${FRQ[r.freq]}, próximo ${esc(r.next)}</span></span><span class="a ${r.type==='ingreso'?'g':'r'}">${money(r.amt)}</span></button>`}).join(''):'<div class="empty">Aún no tienes pagos habituales.</div>')
  +`<button class="btn alt" data-rc="new" style="width:100%;color:var(--am)">+ Nuevo pago habitual</button>`}
function vRem(){return`<h2 style="margin-top:16px">Recordatorios</h2>`
  +(D.rem.length?[...D.rem].sort((a,b)=>a.at.localeCompare(b.at)).map(r=>`<button class="tx" data-rm2="${r.id}"><span class="ic">${ico('bell',20)}</span><span class="m"><b style="${r.done?'text-decoration:line-through;opacity:.6':''}">${esc(r.title)}</b><span>${esc(r.at.replace('T',' '))}${r.rep!=='no'?', '+FRQ[r.rep].toLowerCase():''}</span></span></button>`).join(''):'<div class="empty">Aún no tienes recordatorios.</div>')
  +`<button class="btn alt" data-rm2="new" style="width:100%;color:var(--am)">+ Nuevo recordatorio</button><p class="note">Los avisos aparecen al abrir la app.</p>`}
function vGra(){const n=new Date(),ms=[];
  for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push({k:d.getFullYear()+'-'+p2(d.getMonth()+1),l:d.toLocaleDateString('es',{month:'short'}).replace('.',''),i:0,g:0})}
  D.tx.forEach(t=>{if(V.acc!=='all'&&t.acc!==V.acc)return;const m=ms.find(x=>x.k===t.ts.slice(0,7));if(m){if(t.type==='ingreso')m.i+=t.amt;else m.g+=t.amt}});
  const mx=Math.max(1,...ms.map(m=>Math.max(m.i,m.g))),ti=ms.reduce((s,m)=>s+m.i,0),tg=ms.reduce((s,m)=>s+m.g,0);
  const bars=ms.map((m,j)=>{const x=12+j*51,hi=m.i/mx*130,hg=m.g/mx*130;return`<rect x="${x}" y="${150-hi}" width="19" height="${hi}" rx="4" fill="#10B981"/><rect x="${x+21}" y="${150-hg}" width="19" height="${hg}" rx="4" fill="#EF4444"/><text x="${x+20}" y="169" text-anchor="middle" font-size="11" fill="#F8FAFC" fill-opacity=".62">${esc(m.l)}</text>`}).join('');
  return`<h2 style="margin-top:16px">Últimos 6 meses</h2><div class="card">${accChips()}<svg viewBox="0 0 320 176" class="dn" role="img" aria-label="Ingresos y gastos por mes">${bars}</svg><div class="sum"><span class="g">Ingresos ${money(ti)}</span><span class="r">Gastos ${money(tg)}</span></div></div>`
  +ms.slice().reverse().map(m=>`<div class="ci"><b>${esc(m.l)}</b><strong class="g">+${money(m.i)}</strong><strong class="r">−${money(m.g)}</strong></div>`).join('')}
function recSheet(id){const t=D.rec.find(x=>x.id===id),f=t?{...t}:{type:'gasto',acc:D.accounts[0].id,amt:'',cat:'',note:'',freq:'mes',next:dKey(new Date())};
  const cs=()=>D.cats.filter(c=>c.type===f.type);
  const draw=()=>{if(!cs().some(c=>c.id===f.cat))f.cat=(cs()[0]||{}).id;
    sheet(`<h3>${t?'Editar pago habitual':'Nuevo pago habitual'}</h3>${segH(f.type)}
    <label>Monto<input data-f="amt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" value="${esc(f.amt)}"></label>
    <label>Cuenta<select data-f="acc">${D.accounts.map(a=>`<option value="${a.id}" ${a.id===f.acc?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>
    <div class="lbl">Categoría</div><div class="chips">${cs().map(c=>`<button data-c="${c.id}" class="${f.cat===c.id?'on':''}">${sym(c)} ${esc(c.name)}</button>`).join('')}</div>
    <label>Nota<input data-f="note" maxlength="60" placeholder="Arriendo, Netflix, Salario" value="${esc(f.note)}"></label>
    <label>Se repite<select data-f="freq">${Object.entries(FRQ).map(([k,l])=>`<option value="${k}" ${f.freq===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label>Próxima fecha<input data-f="next" type="date" value="${esc(f.next)}"></label><p class="err" id="err"></p>
    <div class="row"><button class="btn main" id="ok">Guardar</button>${t?'<button class="btn del" id="del">Eliminar</button>':''}</div>`,()=>{
      box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sync(f);f.type=b.dataset.t;draw()});
      box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sync(f);f.cat=b.dataset.c;draw()});
      $('#ok').onclick=()=>{sync(f);const amt=parseFloat(f.amt);
        if(!(amt>0)){$('#err').textContent='Escribe un monto mayor a 0.';return}
        if(!f.next){$('#err').textContent='Elige la próxima fecha.';return}
        const r={type:f.type,acc:f.acc,amt,cat:f.cat,note:f.note.trim(),freq:f.freq,next:f.next,u:Date.now()};
        if(t)Object.assign(t,r);else D.rec.push({id:uid(),...r});save();genRec();closeSheet();render()};
      if(t)$('#del').onclick=()=>{rmv(id);D.rec=D.rec.filter(x=>x.id!==id);save();closeSheet();render()}})};
  draw()}
function remSheet(id){const t=D.rem.find(x=>x.id===id),f=t?{...t}:{title:'',at:nowLocal(),rep:'no'};
  sheet(`<h3>${t?'Editar recordatorio':'Nuevo recordatorio'}</h3><label>Qué quieres recordar<input data-f="title" maxlength="60" placeholder="Pagar la luz" value="${esc(f.title)}"></label>
  <label>Cuándo<input data-f="at" type="datetime-local" value="${esc(f.at)}"></label>
  <label>Repetir<select data-f="rep">${[['no','No se repite'],['dia','Cada día'],['semana','Cada semana'],['mes','Cada mes']].map(([k,l])=>`<option value="${k}" ${f.rep===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <p class="note" style="text-align:left">Los avisos aparecen al abrir la app.</p><p class="err" id="err"></p>
  <div class="row"><button class="btn main" id="ok">Guardar</button>${t?'<button class="btn del" id="del">Eliminar</button>':''}</div>`,()=>{
    $('#ok').onclick=()=>{sync(f);if(!f.title.trim()){$('#err').textContent='Escribe qué quieres recordar.';return}if(!f.at){$('#err').textContent='Elige la fecha y la hora.';return}
      const r={title:f.title.trim(),at:f.at,rep:f.rep,done:false,u:Date.now()};if(t)Object.assign(t,r);else D.rem.push({id:uid(),...r});save();closeSheet();render()};
    if(t)$('#del').onclick=()=>{rmv(id);D.rem=D.rem.filter(x=>x.id!==id);save();closeSheet();render()}})}

/* Períodos */
function range(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),o=V.off;let a,b;
  if(V.per==='dia'){a=new Date(y,m,n.getDate()+o);b=new Date(a)}
  else if(V.per==='semana'){const w=n.getDay()||7;a=new Date(y,m,n.getDate()-w+1+7*o);b=new Date(a);b.setDate(b.getDate()+6)}
  else if(V.per==='mes'){a=new Date(y,m+o,1);b=new Date(y,m+o+1,0)}
  else if(V.per==='anio'){a=new Date(y+o,0,1);b=new Date(y+o,11,31)}
  else{a=V.from?parseD(V.from):new Date(y,m,1);b=V.to?parseD(V.to):n}
  return[dKey(a),dKey(b),a,b]}
function pbar(){const[a,b,da,db]=range(),f=d=>d.toLocaleDateString('es',{day:'numeric',month:'short'});let l='';
  if(V.per==='dia')l=da.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'long'});else if(V.per==='semana')l=f(da)+' – '+f(db);else if(V.per==='mes')l=da.toLocaleDateString('es',{month:'long',year:'numeric'});else l=''+da.getFullYear();
  const mid=V.per==='rango'?`<div class="rg"><input type="date" id="d1" value="${a}"><span>–</span><input type="date" id="d2" value="${b}"></div>`:`<div class="pn"><button data-o="-1" aria-label="Anterior">‹</button><b>${esc(l)}</b><button data-o="1" aria-label="Siguiente">›</button></div>`;
  return`<div class="pt">${[['dia','Día'],['semana','Semana'],['mes','Mes'],['anio','Año'],['rango','Período']].map(([k,t])=>`<button data-p="${k}" class="${V.per===k?'on':''}">${t}</button>`).join('')}</div>${mid}`}
const accChips=()=>`<div class="ar"><button data-a="all" class="${V.acc==='all'?'on':''}">Todas</button>${D.accounts.map(a=>`<button data-a="${a.id}" class="${V.acc===a.id?'on':''}">${sym(a)} ${esc(a.name)}</button>`).join('')}</div>`;
function donut(items,tot){const R=70,C=2*Math.PI*R;let o=0,s='';
  if(!tot)s=`<circle r="${R}" fill="none" stroke="rgba(248,250,252,.1)" stroke-width="22"/>`;
  else items.forEach(i=>{const l=i.v/tot*C;s+=`<circle r="${R}" fill="none" stroke="${i.color}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l});
  return`<svg viewBox="-100 -100 200 200" class="dn" role="img" aria-label="Gráfica por categorías"><g transform="rotate(-90)">${s}</g></svg>`}

/* Vistas */
function vRes(){const[a,b]=range(),ty=V.ty,m=new Map();
  inR(a,b).filter(t=>t.type===ty).forEach(t=>m.set(t.cat,(m.get(t.cat)||0)+t.amt));
  const items=[...m].map(([id,v])=>({...catOf(id),v})).sort((x,y)=>y.v-x.v),tot=items.reduce((s,i)=>s+i.v,0);
  return`<div class="card">${pbar()}${accChips()}<div class="dw">${donut(items,tot)}<div class="ctr"><span>${ty==='gasto'?'Gastos':'Ingresos'}</span><b>${money(tot)}</b></div></div></div>`
  +(items.length?items.map(i=>`<div class="ci"><span class="ic" style="background:${i.color}33;color:${i.color}">${sym(i)}</span><b>${esc(i.name)}</b><em>${Math.round(i.v/tot*100)}%</em><strong>${money(i.v)}</strong></div>`).join(''):'<div class="empty">Sin movimientos en este período.<br>Toca + para registrar uno.</div>')}
const row=t=>{const c=catOf(t.cat),a=accOf(t.acc),i=t.type==='ingreso';return`<button class="tx" data-tx="${t.id}"><span class="ic" style="background:${c.color}33;color:${c.color}">${sym(c)}</span><span class="m"><b>${esc(c.name)}</b><span>${hour(t.ts)}, ${a?esc(a.name):'Cuenta eliminada'}${t.note?', '+esc(t.note):''}</span></span><span class="a ${i?'g':'r'}">${i?'+':'−'}${money(t.amt)}</span></button>`};
function vOps(){const[a,b]=range(),ts=inR(a,b).sort((x,y)=>V.sort==='monto'?y.amt-x.amt:y.ts.localeCompare(x.ts)),net=ts.reduce((s,t)=>s+(t.type==='ingreso'?t.amt:-t.amt),0);let h='',last='';
  ts.forEach(t=>{const k=t.ts.slice(0,10);if(V.sort!=='monto'&&k!==last){h+=`<div class="day">${esc(dayLabel(k))}</div>`;last=k}h+=row(t)});
  return`<div class="card">${pbar()}${accChips()}</div><div class="sum"><span>Total: <span class="${net<0?'r':'g'}">${money(net)}</span></span><button class="link" data-s="1">Ordenar: ${V.sort==='monto'?'por monto':'por fecha'}</button></div>`+(h||'<div class="empty">Sin operaciones en este período.</div>')}
function vCta(){return`<h2 style="margin-top:16px">Tus cuentas</h2>`+D.accounts.map(a=>`<button class="tx" data-ac="${a.id}"><span class="ic" style="background:${a.color};color:#101A23">${sym(a)}</span><span class="m"><b>${esc(a.name)}</b><span>Toca para editar</span></span><span class="a ${abal(a)<0?'r':''}">${money(abal(a))}</span></button>`).join('')+`<button class="btn alt" data-ac="new" style="width:100%;color:var(--am)">+ Nueva cuenta</button>`}
function vCat(){const list=ty=>D.cats.filter(c=>c.type===ty).map(c=>`<button class="tx" data-ct="${c.id}"><span class="ic" style="background:${c.color}33;color:${c.color}">${sym(c)}</span><span class="m"><b>${esc(c.name)}</b></span></button>`).join('')+`<button class="btn alt" data-ct="new" data-ctype="${ty}" style="width:100%;color:var(--am)">+ Nueva categoría de ${ty==='gasto'?'gastos':'ingresos'}</button>`;
  return`<h2 style="margin-top:16px">Categorías de gastos</h2>${list('gasto')}<h2>Categorías de ingresos</h2>${list('ingreso')}`}
function vCfg(){return`<h2 style="margin-top:16px">Tu nombre</h2><label style="margin-top:8px"><input id="nm" maxlength="30" placeholder="Opcional" value="${esc(D.name||'')}"></label>
  <h2>Moneda</h2><label style="margin-top:8px"><select id="cur">${CURS.map(c=>`<option ${c===D.cur?'selected':''}>${c}</option>`).join('')}</select></label>
  <h2>Datos</h2><button class="tx" id="csv">${ico('download',20)}<span class="m"><b>Exportar a Excel (CSV)</b></span></button>
  <button class="btn alt" id="wipe" style="width:100%;margin-top:22px;color:var(--r)">Borrar todos los datos</button><p class="note">Tus datos están en este teléfono. Funcionan sin internet.</p>`}
function render(){
  $('#bar').hidden=!(V.view==='res'||V.view==='ops');
  const[a,b]=range(),ts=inR(a,b),sm=ty=>ts.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
  $('#bal').textContent=money(D.accounts.reduce((s,x)=>s+abal(x),0));
  $('#tt').innerHTML=V.view==='res'?['gasto','ingreso'].map(k=>`<button data-ty="${k}" class="${k} ${V.ty===k?'on':''}">${k==='gasto'?'Gastos':'Ingresos'}<small>${money(sm(k))}</small></button>`).join(''):'';
  $('#main').innerHTML=(V.view==='res'?banner():'')+({res:vRes,ops:vOps,cta:vCta,cfg:vCfg,gra:vGra,cat:vCat,rec:vRec,rem:vRem})[V.view]();
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===V.view));
  $('#fab').hidden=V.view==='cfg';
}

/* Hojas (ventanas inferiores) */
const ov=$('#ov'),box=$('#box');
function sheet(h,bind){box.innerHTML=h;ov.classList.add('open');bind&&bind()}
const closeSheet=()=>{ov.classList.remove('open');box.innerHTML=''};
ov.addEventListener('click',e=>{if(e.target===ov)closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const segH=(ty)=>`<div class="seg"><button data-t="gasto" class="${ty==='gasto'?'on r':''}">Gastos</button><button data-t="ingreso" class="${ty==='ingreso'?'on g':''}">Ingresos</button></div>`;
const sync=f=>box.querySelectorAll('[data-f]').forEach(i=>f[i.dataset.f]=i.value);
const sureBtn=(el,txt,fn)=>{el.onclick=()=>{if(!el.dataset.s){el.dataset.s=1;el.textContent=txt;return}fn()}};
function txSheet(id){const t=D.tx.find(x=>x.id===id),f=t?{...t}:{type:V.ty,acc:V.acc!=='all'?V.acc:D.accounts[0].id,amt:'',cat:'',note:'',ts:nowLocal()};
  const cs=()=>D.cats.filter(c=>c.type===f.type);
  const draw=()=>{if(!cs().some(c=>c.id===f.cat))f.cat=(cs()[0]||{}).id;
    sheet(`<h3>${t?'Editar operación':'Nueva operación'}</h3>${segH(f.type)}
    <label>Monto<input data-f="amt" type="number" inputmode="decimal" step="any" min="0" placeholder="0" value="${esc(f.amt)}"></label>
    <label>Cuenta<select data-f="acc">${D.accounts.map(a=>`<option value="${a.id}" ${a.id===f.acc?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>
    <div class="lbl">Categoría</div><div class="chips">${cs().map(c=>`<button data-c="${c.id}" class="${f.cat===c.id?'on':''}">${sym(c)} ${esc(c.name)}</button>`).join('')}</div>
    <label>Nota<input data-f="note" maxlength="60" placeholder="Opcional" value="${esc(f.note)}"></label>
    <label>Fecha y hora<input data-f="ts" type="datetime-local" value="${esc(f.ts)}"></label><p class="err" id="err"></p>
    <div class="row"><button class="btn main" id="ok">Guardar</button>${t?'<button class="btn del" id="del">Eliminar</button>':''}</div>`,()=>{
      box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sync(f);f.type=b.dataset.t;draw()});
      box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sync(f);f.cat=b.dataset.c;draw()});
      $('#ok').onclick=()=>{sync(f);const amt=parseFloat(f.amt);
        if(!(amt>0)){$('#err').textContent='Escribe un monto mayor a 0.';return}
        if(!f.ts){$('#err').textContent='Elige la fecha y la hora.';return}
        const r={type:f.type,acc:f.acc,amt,cat:f.cat,note:f.note.trim(),ts:f.ts,u:Date.now()};
        if(t)Object.assign(t,r);else D.tx.push({id:uid(),...r});save();closeSheet();render()};
      if(t)$('#del').onclick=()=>{rmv(id);D.tx=D.tx.filter(x=>x.id!==id);save();closeSheet();render()}})};
  draw()}
function accSheet(id){const a=id?accOf(id):null,f=a?{...a}:{name:'',icon:'card',color:'#F59E0B',init:0};
  const draw=()=>sheet(`<h3>${a?'Editar cuenta':'Nueva cuenta'}</h3>
    <label>Nombre<input data-f="name" maxlength="24" placeholder="Ahorros, Efectivo, Negocio" value="${esc(f.name)}"></label>
    <label>Saldo inicial<input data-f="init" type="number" inputmode="decimal" step="any" placeholder="0" value="${esc(f.init)}"></label>
    <div class="lbl">Ícono</div><div class="chips eg">${AEM.map(e=>`<button data-e="${e}" class="${f.icon===e?'on':''}" aria-label="${e}">${ico(e)}</button>`).join('')}</div>
    <div class="lbl">Color</div><div class="chips">${COLORS.map(c=>`<button class="sw ${f.color===c?'on':''}" data-k="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div><p class="err" id="err"></p>
    <div class="row"><button class="btn main" id="ok">Guardar</button>${a&&D.accounts.length>1?'<button class="btn del" id="del">Eliminar</button>':''}</div>`,()=>{
    box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{sync(f);f.icon=b.dataset.e;draw()});
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sync(f);f.color=b.dataset.k;draw()});
    $('#ok').onclick=()=>{sync(f);const name=f.name.trim();if(!name){$('#err').textContent='Ponle un nombre a la cuenta.';return}
      const r={name,icon:f.icon,color:f.color,init:parseFloat(f.init)||0,u:Date.now()};if(a)Object.assign(a,r);else D.accounts.push({id:uid(),...r});save();closeSheet();render()};
    if($('#del'))sureBtn($('#del'),'¿Seguro? Se borran sus movimientos',()=>{D.tx.filter(x=>x.acc===id).forEach(x=>rmv(x.id));rmv(id);D.tx=D.tx.filter(x=>x.acc!==id);D.accounts=D.accounts.filter(x=>x.id!==id);V.acc='all';save();closeSheet();render()})});
  draw()}
function catSheet(id,ty){const c=id?D.cats.find(x=>x.id===id):null,f=c?{...c}:{name:'',type:ty||'gasto',icon:'cart',color:'#10B981'};
  const draw=()=>sheet(`<h3>${c?'Editar categoría':'Nueva categoría'}</h3>${segH(f.type)}
    <label>Nombre<input data-f="name" maxlength="20" placeholder="Compras" value="${esc(f.name)}"></label>
    <div class="lbl">Símbolo</div><div class="chips eg">${EM.map(e=>`<button data-e="${e}" class="${f.icon===e?'on':''}" aria-label="${e}">${ico(e)}</button>`).join('')}</div>
    <div class="lbl">Color</div><div class="chips">${COLORS.map(k=>`<button class="sw ${f.color===k?'on':''}" data-k="${k}" style="background:${k}" aria-label="Color ${k}"></button>`).join('')}</div><p class="err" id="err"></p>
    <div class="row"><button class="btn main" id="ok">Guardar</button>${c?'<button class="btn del" id="del">Eliminar</button>':''}</div>`,()=>{
    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sync(f);f.type=b.dataset.t;draw()});
    box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{sync(f);f.icon=b.dataset.e;draw()});
    box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sync(f);f.color=b.dataset.k;draw()});
    $('#ok').onclick=()=>{sync(f);const name=f.name.trim();if(!name){$('#err').textContent='Ponle un nombre a la categoría.';return}
      const r={name,type:f.type,icon:f.icon,color:f.color,u:Date.now()};if(c)Object.assign(c,r);else D.cats.push({id:uid(),...r});save();closeSheet();render()};
    if(c)sureBtn($('#del'),'¿Seguro?',()=>{rmv(id);D.cats=D.cats.filter(x=>x.id!==id);save();closeSheet();render()})});
  draw()}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||ov.contains(t)||!D)return;const d=t.dataset;
  if(d.v){V.view=d.v;render();scrollTo(0,0)}else if(d.ty){V.ty=d.ty;render()}else if(d.p){V.per=d.p;V.off=0;render()}
  else if(d.o){V.off+=+d.o;render()}else if(d.a){V.acc=d.a;render()}else if(d.s){V.sort=V.sort==='monto'?'fecha':'monto';render()}
  else if(d.tx)txSheet(d.tx);else if(d.ac)accSheet(d.ac==='new'?undefined:d.ac);else if(d.ct)catSheet(d.ct==='new'?undefined:d.ct,d.ctype);
  else if(t.id==='fab')({rec:()=>recSheet(),rem:()=>remSheet(),cat:()=>catSheet(undefined,'gasto'),cta:()=>accSheet()}[V.view]||(()=>txSheet()))();else if(d.rd)remDone(d.rd);else if(d.rc)recSheet(d.rc==='new'?undefined:d.rc);else if(d.rm2)remSheet(d.rm2==='new'?undefined:d.rm2);else if(t.id==='wipe')wipe();else if(t.id==='csv')exportCsv();else if(t.id==='menu')menu()});
document.addEventListener('change',e=>{const t=e.target;if(!D)return;if(t.id==='d1'){V.from=t.value;render()}else if(t.id==='d2'){V.to=t.value;render()}else if(t.id==='nm'){D.name=t.value.trim();save()}else if(t.id==='cur'){D.cur=t.value;D.curU=Date.now();save();render()}});

document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ico(e.dataset.i));
if(ls.get('mc3_ok')||ls.get('mc3_data')||ls.get('mc2_ses'))start();else welcome();
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
